<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Handball Tagger Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 12px; margin: 0; box-sizing: border-box; }
        
        /* Acordeones */
        .accordion { background-color: #1e1e1e; color: #eee; cursor: pointer; padding: 12px; width: 100%; text-align: left; border: 1px solid #333; outline: none; transition: 0.4s; border-radius: 8px; font-weight: bold; margin-bottom: 5px; font-size: 1.1em;}
        .accordion.active, .accordion:hover { background-color: #2c2c2c; }
        .accordion:after { content: '\002B'; font-weight: bold; float: right; }
        .accordion.active:after { content: "\2212"; }
        .panel { padding: 0 15px; background-color: #121212; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; margin-bottom: 10px; }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px 0; }
        .config-box { background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333;}
        .config-box label { font-size: 0.85em; color: #aaa; display: block; margin-bottom: 5px; }
        .config-box input { width: 100%; box-sizing: border-box; background: #2c2c2c; border: 1px solid #555; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px;}
        .config-full { grid-column: span 2; background: #222; border: 1px solid #ffb300; }

        /* Layout Principal */
        .main-layout { display: grid; grid-template-columns: 50% 50%; gap: 15px; align-items: stretch; }
        .left-col { display: flex; flex-direction: column; gap: 12px; }
        .right-col { display: flex; flex-direction: column; gap: 10px; background: #1a1a1a; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        
        .header-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .score-box { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.4em; font-weight: bold; }
        .team-input { width: 80px; background: #2c2c2c; border: 1px solid #555; color: white; padding: 6px; font-size: 0.9em; text-align: center; border-radius: 4px; }
        
        .timer-box { background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #2d2d2d; text-align: center; }
        #timer { font-family: monospace; font-size: 2em; color: #00e676; margin-bottom: 8px; font-weight: bold;}
        .row { display: flex; gap: 6px; justify-content: center; }
        .btn-timer { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 1.1em; cursor: pointer; }
        
        .step-label { font-size: 0.9em; color: #ffb300; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; text-align: center; background: #333; padding: 5px; border-radius: 4px;}
        
        .btn-row { display: flex; gap: 10px; margin-bottom: 5px; }
        .btn-option { flex: 1; padding: 18px 10px; font-size: 1.1em; font-weight: bold; border-radius: 8px; border: 2px solid #444; background: #2c2c2c; color: #ccc; cursor: pointer; transition: 0.2s;}
        
        .fase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .fase-penal { grid-column: span 2; }

        #Eq-LOC.active { background: #1565c0; color: #fff; border-color: #64b5f6; }
        #Eq-VIS.active { background: #c62828; color: #fff; border-color: #ef5350; }
        
        #Fase-Pos.active { background: #6a1b9a; color: #fff; border-color: #ab47bc; }
        #Fase-Tra.active { background: #00695c; color: #fff; border-color: #26a69a; }
        #Fase-Pen.active { background: #f57f17; color: #fff; border-color: #ffee58; }

        .action-box { background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;}
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; flex-grow: 1;}
        .btn-result { padding: 15px 10px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .btn-result:active { opacity: 0.7; transform: scale(0.98); }
        .bg-gol { background: #2e7d32; }
        .bg-parada { background: #ef6c00; }
        .bg-fallo { background: #546e7a; }
        .bg-perdida { background: #b71c1c; }

        .canvas-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; border-radius: 8px; padding: 10px; flex-grow: 1; }
        canvas { width: 100%; max-width: 320px; height: auto; background: #000; border-radius: 4px; display: block; cursor: crosshair; touch-action: none; }
        .coord-text { font-size: 0.8em; color: #aaa; margin-top: 6px; font-family: monospace; }
        
        /* Modal Pop-up */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background-color: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #444; width: 90%; max-width: 500px; text-align: center; }
        .modal-title { font-size: 1.5em; font-weight: bold; margin-bottom: 15px; color: #ffb300; }
        .jersey-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .jersey-btn { background: #333; color: white; border: 2px solid #555; border-radius: 8px; width: 60px; height: 60px; font-size: 1.5em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .jersey-btn:active { background: #555; transform: scale(0.95); }
        .btn-omit { background: #b71c1c; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; width: 100%; }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-detail { background: #2c2c2c; color: white; border: 2px solid #b71c1c; border-radius: 8px; padding: 15px 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .btn-detail:active { background: #b71c1c; transform: scale(0.95); }

        .table-container { max-height: 180px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; font-size: 0.7em; border-collapse: collapse; background: #1e1e1e; }
        th, td { border: 1px solid #444; padding: 6px; text-align: center; }
        th { background: #2c2c2c; position: sticky; top: 0; }
    </style>
</head>
<body>
    
    <!-- ACORDEÓN 1: CONFIGURACIÓN DE EQUIPOS Y PARTIDO -->
    <button class="accordion">⚙️ Configurar Partido y Camisetas</button>
    <div class="panel">
        <div class="config-grid">
            <!-- NUEVO: CAJA DEL NOMBRE DEL PARTIDO -->
            <div class="config-box config-full">
                <label style="color: #ffb300; font-weight: bold; font-size: 1em;">🏆 Nombre del Partido (Para historial del torneo)</label>
                <input type="text" id="nombre-partido" placeholder="Ej. J1 vs Brasil" style="font-size: 1.1em;">
            </div>
            
            <div class="config-box">
                <div style="color: #64b5f6; font-weight: bold; margin-bottom: 10px;">EQUIPO LOCAL</div>
                <label>Jugadores de Campo (Separados por coma)</label>
                <input type="text" id="loc-field" value="2, 4, 7, 9, 10, 14, 18, 22">
                <label>Porteros (Separados por coma)</label>
                <input type="text" id="loc-gk" value="1, 12, 16">
            </div>
            <div class="config-box">
                <div style="color: #ef5350; font-weight: bold; margin-bottom: 10px;">EQUIPO VISITANTE</div>
                <label>Jugadores de Campo (Separados por coma)</label>
                <input type="text" id="vis-field" value="3, 5, 8, 11, 13, 15, 19, 21">
                <label>Porteros (Separados por coma)</label>
                <input type="text" id="vis-gk" value="1, 12">
            </div>
        </div>
    </div>

    <!-- UI PRINCIPAL -->
    <div class="main-layout" style="margin-top: 15px;">
        <div class="left-col">
            <div>
                <div class="header-container">
                    <div class="score-box"><input type="text" id="nameLOC" value="LOC" class="team-input"> : <span id="scoreLOC">0</span></div>
                    <div class="score-box"><input type="text" id="nameVIS" value="VIS" class="team-input"> : <span id="scoreVIS">0</span></div>
                </div>

                <div class="timer-box">
                    <div id="timer">00:00:00.00</div>
                    <div class="row">
                        <button class="btn-timer" onclick="controlTimer('start')">▶️ Iniciar</button>
                        <button class="btn-timer" onclick="controlTimer('pause')">⏸️ Pausa</button>
                        <button class="btn-timer" onclick="togglePeriodo()" id="btn-periodo" style="background:#555;">1T</button>
                    </div>
                </div>
                
                <div class="step-label">1. ¿Quien ataca?</div>
                <div class="btn-row">
                    <button class="btn-option" onclick="setEquipo('LOC')" id="Eq-LOC">LOCAL</button>
                    <button class="btn-option" onclick="setEquipo('VIS')" id="Eq-VIS">VISITANTE</button>
                </div>
                
                <div class="step-label">2. Fase / Tipo</div>
                <div class="fase-grid">
                    <button class="btn-option active" onclick="setFase('Posicional')" id="Fase-Pos">POSICIONAL</button>
                    <button class="btn-option" onclick="setFase('Transicion')" id="Fase-Tra">TRANSICION</button>
                    <button class="btn-option fase-penal" onclick="setFase('Penal')" id="Fase-Pen">PENAL</button>
                </div>
            </div>
            
            <div class="action-box">
                <div class="step-label">4. ¿Que paso?</div>
                <div class="action-grid">
                    <button class="btn-result bg-gol" onclick="iniciarRegistro('Gol')">GOL</button>
                    <button class="btn-result bg-parada" onclick="iniciarRegistro('Parada')">PARADA</button>
                    <button class="btn-result bg-fallo" onclick="iniciarRegistro('Fallo')">FALLO</button>
                    <button class="btn-result bg-perdida" onclick="iniciarRegistro('Perdida')">PERDIDA</button>
                </div>
                <button class="btn-timer" onclick="resetAll()" style="width: 100%; background: #424242; font-size: 0.9em; padding: 10px;">🧹 Cancelar Accion / Limpiar</button>
            </div>
        </div>

        <div class="right-col">
            <div class="step-label">3. ¿Donde?</div>
            
            <div class="canvas-box">
                <div style="font-size: 0.8em; color:#ccc; margin-bottom:4px;">Origen</div>
                <canvas id="cancha" width="300" height="300"></canvas>
                <div id="c-text" class="coord-text">Lado: N/A</div>
            </div>

            <div class="canvas-box">
                <div style="font-size: 0.8em; color:#ccc; margin-bottom:4px;">Destino</div>
                <canvas id="porteria" width="300" height="150"></canvas>
                <div id="z-text" class="coord-text">Zona: N/A</div>
            </div>
        </div>
    </div>

    <!-- ACORDEÓN 2: REGISTRO RECIENTE -->
    <button class="accordion" style="margin-top: 15px;">📋 Últimas acciones registradas</button>
    <div class="panel">
        <div class="table-container">
            <table id="log">
                <thead>
                    <tr>
                        <!-- NUEVA COLUMNA DE PARTIDO EN LA TABLA -->
                        <th>Partido</th><th>Tiempo</th><th>Equipo</th><th>Jugador</th><th>Fase</th><th>Resultado</th><th>Detalle</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL PRINCIPAL -->
    <div id="jerseyModal" class="modal">
        <div class="modal-content">
            <div id="view-jerseys" style="display: block;">
                <div class="modal-title" id="modal-title-text">¿Quién fue?</div>
                <div id="jersey-container" class="jersey-grid"></div>
                <button class="btn-omit" onclick="handleJerseySelection('N/A')">No vi el número / Omitir</button>
            </div>
            <div id="view-details" style="display: none;">
                <div class="modal-title">⚠️ ¿Cómo la perdió?</div>
                <div class="details-grid">
                    <button class="btn-detail" onclick="finalizarRegistroCompleto('Mal Pase')">Mal Pase</button>
                    <button class="btn-detail" onclick="finalizarRegistroCompleto('Violación (Pasos/Dobles)')">Violación (Pasos/Dobles)</button>
                    <button class="btn-detail" onclick="finalizarRegistroCompleto('Falta Ofensiva')">Falta Ofensiva</button>
                    <button class="btn-detail" onclick="finalizarRegistroCompleto('Balón Suelto / Robo')">Balón Suelto / Robo</button>
                </div>
                <button class="btn-omit" style="background:#555;" onclick="finalizarRegistroCompleto('N/A')">Omitir detalle</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // URL DE MAKE
        // ==========================================
        const URL_MAKE = "https://hook.us2.make.com/1s41v7gvbf3p8tfrqqmip48pesbnqqei"; 

        let startTime = 0, elapsedTime = 0;
        let timerInterval = null;
        let run = false, periodo = "1T";
        let score = {LOC: 0, VIS: 0}; 
        
        let state = {Eq: null, Jugador: '', Fase: 'Posicional', Lado: '', CX: null, CY: null, Zona: '', PX: null, PY: null, Detalle: ''};
        let pendingResult = ""; 
        let pasoModal = 1; 
        let tempPortero = ""; 

        const pCanvas = document.getElementById('porteria');
        const cCanvas = document.getElementById('cancha');
        const pCtx = pCanvas.getContext('2d');
        const cCtx = cCanvas.getContext('2d');
        
        const pImg = new Image(); 
        pImg.onload = () => pCtx.drawImage(pImg, 0, 0, pCanvas.width, pCanvas.height);
        pImg.src = 'NS_Goal_handball.png';
        
        const cImg = new Image(); 
        cImg.onload = () => cCtx.drawImage(cImg, 0, 0, cCanvas.width, cCanvas.height);
        cImg.src = 'NS_ui_Balonmano_BL_V_T.jpg';
        
        window.onload = () => {
            document.getElementById('nameLOC').addEventListener('input', (e) => document.getElementById('Eq-LOC').innerText = e.target.value || 'LOCAL');
            document.getElementById('nameVIS').addEventListener('input', (e) => document.getElementById('Eq-VIS').innerText = e.target.value || 'VISITANTE');
            resetAll(); 
        };

        var acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                } 
            });
        }

        function controlTimer(action) { 
            if (action === 'start' && !run) { run = true; startTime = Date.now() - elapsedTime; timerInterval = setInterval(updateTimerDisplay, 10); } 
            else if (action === 'pause' && run) { run = false; clearInterval(timerInterval); elapsedTime = Date.now() - startTime; }
        }

        function togglePeriodo() { periodo = (periodo === "1T") ? "2T" : "1T"; document.getElementById('btn-periodo').innerText = periodo; }

        function updateTimerDisplay() {
            elapsedTime = Date.now() - startTime;
            let totalSeconds = Math.floor(elapsedTime / 1000);
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            let c = Math.floor((elapsedTime % 1000) / 10); 
            document.getElementById('timer').innerText = [m, s].map(v => v.toString().padStart(2, '0')).join(':') + '.' + c.toString().padStart(2, '0');
        }

        cCanvas.addEventListener('pointerdown', (e) => { 
            const r = cCanvas.getBoundingClientRect();
            state.CX = Math.round(((e.clientX - r.left) / r.width) * 100);
            state.CY = Math.round(((e.clientY - r.top) / r.height) * 100);
            state.Lado = (state.CX <= 33.33) ? "Izq" : (state.CX <= 66.66) ? "Cen" : "Der";
            document.getElementById('c-text').innerText = `Lado: ${state.Lado} (${state.CX}, ${state.CY})`;
            cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); 
            cCtx.drawImage(cImg,0,0,cCanvas.width,cCanvas.height);
            cCtx.fillStyle = "#ff9800"; 
            cCtx.beginPath(); cCtx.arc((state.CX/100)*cCanvas.width, (state.CY/100)*cCanvas.height, 8, 0, Math.PI*2); cCtx.fill();
        });

        pCanvas.addEventListener('pointerdown', (e) => {
            const r = pCanvas.getBoundingClientRect();
            state.PX = Math.round(((e.clientX - r.left) / r.width) * 100);
            state.PY = Math.round(((e.clientY - r.top) / r.height) * 100);
            let row = (state.PY <= 33.33) ? 0 : (state.PY <= 66.66) ? 1 : 2;
            let col = (state.PX <= 33.33) ? 1 : (state.PX <= 66.66) ? 2 : 3;
            state.Zona = 'Z' + ((row * 3) + col);
            document.getElementById('z-text').innerText = `Zona: ${state.Zona} (${state.PX}, ${state.PY})`;
            pCtx.clearRect(0,0,pCanvas.width,pCanvas.height); 
            pCtx.drawImage(pImg,0,0,pCanvas.width,pCanvas.height);
            pCtx.fillStyle = "#ff9800"; 
            pCtx.beginPath(); pCtx.arc((state.PX/100)*pCanvas.width, (state.PY/100)*pCanvas.height, 6, 0, Math.PI*2); pCtx.fill();
        });

        function setEquipo(eq) {
            state.Eq = eq;
            document.getElementById('Eq-LOC').classList.toggle('active', eq === 'LOC');
            document.getElementById('Eq-VIS').classList.toggle('active', eq === 'VIS');
        }

        function setFase(fase) {
            state.Fase = fase;
            document.getElementById('Fase-Pos').classList.toggle('active', fase === 'Posicional');
            document.getElementById('Fase-Tra').classList.toggle('active', fase === 'Transicion');
            document.getElementById('Fase-Pen').classList.toggle('active', fase === 'Penal');

            if (fase === 'Penal') {
                state.CX = 50; state.CY = 41; state.Lado = 'Cen';
                document.getElementById('c-text').innerText = `Lado: ${state.Lado} (50, 41) [PENAL]`;
                if(cImg.complete) {
                    cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); 
                    cCtx.drawImage(cImg,0,0,cCanvas.width,cCanvas.height);
                    cCtx.fillStyle = "#ff2a2a";
                    cCtx.beginPath(); cCtx.arc((50/100)*cCanvas.width, (41/100)*cCanvas.height, 8, 0, Math.PI*2); cCtx.fill();
                }
            } else {
                if (state.CX === 50 && state.CY === 41) {
                    state.CX = null; state.CY = null; state.Lado = '';
                    document.getElementById('c-text').innerText = 'Lado: N/A';
                    if(cImg.complete) { cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); cCtx.drawImage(cImg,0,0,cCanvas.width,cCanvas.height); }
                }
            }
        }

        function resetAll() {
            state = {Eq: null, Jugador: '', Fase: 'Posicional', Lado: '', CX: null, CY: null, Zona: '', PX: null, PY: null, Detalle: ''};
            document.getElementById('Eq-LOC').classList.remove('active');
            document.getElementById('Eq-VIS').classList.remove('active');
            document.getElementById('Fase-Pos').classList.add('active');
            document.getElementById('Fase-Tra').classList.remove('active');
            document.getElementById('Fase-Pen').classList.remove('active');
            document.getElementById('c-text').innerText = 'Lado: N/A'; 
            document.getElementById('z-text').innerText = 'Zona: N/A'; 
            if(pImg.complete) { pCtx.clearRect(0,0,pCanvas.width,pCanvas.height); pCtx.drawImage(pImg,0,0,pCanvas.width,pCanvas.height); }
            if(cImg.complete) { cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); cCtx.drawImage(cImg,0,0,cCanvas.width,cCanvas.height); }
        }

        function iniciarRegistro(resultado) { 
            if (!state.Eq) { alert("⚠️ Selecciona el Equipo atacante antes de registrar."); return; }
            pendingResult = resultado;
            pasoModal = 1;
            state.Jugador = ''; 
            state.Detalle = '';

            document.getElementById('view-jerseys').style.display = 'block';
            document.getElementById('view-details').style.display = 'none';

            if (resultado === 'Parada') {
                let eqDefensor = (state.Eq === 'LOC') ? 'vis' : 'loc';
                let inputGk = document.getElementById(eqDefensor + '-gk').value;
                mostrarBotonesCamisetas(inputGk, "🛡️ ¿Qué Portero atajó?", (eqDefensor === 'loc') ? '#1565c0' : '#c62828');
            } else {
                let inputField = document.getElementById(state.Eq.toLowerCase() + '-field').value;
                mostrarBotonesCamisetas(inputField, "🎯 ¿Quién tiró / la perdió?", (state.Eq === 'LOC') ? '#1565c0' : '#c62828');
            }
            document.getElementById('jerseyModal').style.display = 'flex';
        }

        function mostrarBotonesCamisetas(csvNumbers, title, color) {
            document.getElementById('modal-title-text').innerText = title;
            let container = document.getElementById('jersey-container');
            container.innerHTML = ''; 
            let nums = csvNumbers.split(',').map(n => n.trim()).filter(n => n !== '');
            nums.forEach(num => {
                let btn = document.createElement('button');
                btn.className = 'jersey-btn';
                btn.innerText = num;
                btn.style.borderColor = color;
                btn.onclick = () => handleJerseySelection(num);
                container.appendChild(btn);
            });
        }

        function handleJerseySelection(numSeleccionado) {
            if (pendingResult === 'Parada') {
                if (pasoModal === 1) {
                    tempPortero = numSeleccionado;
                    pasoModal = 2;
                    let inputField = document.getElementById(state.Eq.toLowerCase() + '-field').value;
                    mostrarBotonesCamisetas(inputField, "🎯 ¿Y quién tiró?", (state.Eq === 'LOC') ? '#1565c0' : '#c62828');
                    return;
                } else {
                    state.Jugador = numSeleccionado;
                    let detallePortero = (tempPortero === 'N/A') ? 'N/A' : 'Portero: ' + tempPortero;
                    finalizarRegistroCompleto(detallePortero);
                    return;
                }
            }
            state.Jugador = numSeleccionado;
            if (pendingResult === 'Perdida') {
                document.getElementById('view-jerseys').style.display = 'none';
                document.getElementById('view-details').style.display = 'block';
            } else {
                finalizarRegistroCompleto('N/A');
            }
        }

        function finalizarRegistroCompleto(detalle) {
            document.getElementById('jerseyModal').style.display = 'none'; 
            state.Detalle = detalle;
            
            if (state.Fase === 'Penal') { state.CX = 50; state.CY = 41; state.Lado = 'Cen'; }

            // NUEVO: Capturar el Nombre del Partido
            let nombrePartido = document.getElementById('nombre-partido').value;
            if (nombrePartido.trim() === '') nombrePartido = "Sin Nombre";

            const nombreEq = (state.Eq === 'LOC') ? document.getElementById('nameLOC').value : document.getElementById('nameVIS').value;
                             
            if (pendingResult === 'Gol') { score[state.Eq]++; document.getElementById('score'+state.Eq).innerText = score[state.Eq]; } 
            
            const timestamp = document.getElementById('timer').innerText;
            const coordCancha = state.CX !== null ? `${state.CX},${state.CY}` : '';
            const coordPorteria = state.PX !== null ? `${state.PX},${state.PY}` : '';

            // Mostrar "Partido" en la tabla visual
            const row = `<tr>
                <td style="color:#aaa;">${nombrePartido}</td>
                <td>${timestamp}</td>
                <td>${nombreEq}</td>
                <td style="font-weight:bold; color:#00e676;">${state.Jugador}</td>
                <td>${state.Fase}</td>
                <td style="font-weight:bold;">${pendingResult}</td>
                <td style="color:#ffb300;">${state.Detalle}</td>
            </tr>`;
            
            const tbody = document.querySelector('#log tbody');
            tbody.insertAdjacentHTML('afterbegin', row); 
            while (tbody.children.length > 3) { tbody.removeChild(tbody.lastChild); }

            // ENVIAR A MAKE CON LA NUEVA VARIABLE "partido"
            if (URL_MAKE !== "AQUI_VA_EL_LINK_DE_MAKE") {
                const payload = {
                    partido: nombrePartido,  // <-- AQUÍ SE ENVÍA A MAKE
                    tiempo: timestamp,
                    periodo: periodo,
                    equipo: nombreEq,
                    jugador: state.Jugador,
                    fase: state.Fase,
                    resultado: pendingResult,
                    detalle: state.Detalle, 
                    lado: state.Lado,
                    coord_cancha: coordCancha,
                    zona_porteria: state.Zona,
                    coord_porteria: coordPorteria
                };
                
                fetch(URL_MAKE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.error("Error al enviar a Make", err));
            }

            resetAll();
        }
    </script>
</body>
</html>
